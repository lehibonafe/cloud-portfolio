<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, follow" />
<meta name="description" content="The requested page could not be found." />
<title>Page Not Found — Lehi Bonafe</title>
<script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="doc-header">
  <div class="container doc-header-inner">
    <a href="/" class="doc-back"><i class="bi bi-house" aria-hidden="true"></i> Home</a>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button type="button" data-theme-btn="light" title="Light theme">☀</button>
      <button type="button" data-theme-btn="dark" class="active" title="Dark theme">☾</button>
    </div>
  </div>
</header>

<main class="container doc-main reveal" aria-labelledby="error-title">
  <span class="project-index">HTTP 404</span>
  <h1 id="error-title" class="doc-title">Page not found</h1>
  <p class="doc-lead">The page may have moved, been renamed, or no longer exists. Return to the portfolio or browse the Projects section.</p>

  <div class="doc-footer-links">
    <a href="/" class="btn btn-primary"><i class="bi bi-house" aria-hidden="true"></i>Home</a>
    <a href="/#projects" class="btn"><i class="bi bi-folder" aria-hidden="true"></i>Projects</a>
  </div>
</main>

<script src="/script.js"></script>
</body>
</html>
